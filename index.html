<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula28-09</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="home">
        <h1>TechStore - Soluções em Tecnologia</h1>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="produtos" class="card">
            <h2>Passo a Passo de Compra</h2>
            <ol>
                <li>Escolha o produto no catálogo</li>
                <li>Informe o endereço de entrega</li>
                <li>Realize o pagamento com segurança</li>
            </ol>
            <img src="" alt="Promoção especial da TechStore com ofertas em produtos tecnológicos">
        </section>
        <section id="contato" class="card">
            <h2>Fale Conosco</h2>
            <form action="#" method="post">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="btn-destaque">Enviar</button>
            </form>
        </section>
    </main>
</body>

</html>
